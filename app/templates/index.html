<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConsultBae Gig Audio Submission</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #faf9f7;
    --line: #d8d4cc;
    --accent: #2f6f4f;
    --accent-dark: #21503a;
    --danger: #b3452c;
    --muted: #6b6558;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.95rem; }
  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    background: white;
    margin-top: 20px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
  input[type=text], input[type=tel] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .rec-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
  }
  #recordBtn { background: var(--accent); color: white; }
  #recordBtn.recording { background: var(--danger); }
  #recordBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .or-divider { text-align: center; color: var(--muted); margin: 18px 0; font-size: 0.85rem; }
  input[type=file] { width: 100%; }
  audio { width: 100%; margin-top: 14px; }
  #status { font-size: 0.88rem; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .submit-btn {
    width: 100%;
    background: var(--accent-dark);
    color: white;
    padding: 13px;
    margin-top: 20px;
    font-size: 1rem;
  }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .flash {
    background: #fff3ea;
    border: 1px solid #e0a97a;
    padding: 10px 14px;
    border-radius: 6px;
    margin-top: 16px;
    font-size: 0.9rem;
  }
  a.nav-link { color: var(--accent-dark); font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Submit a voice sample</h1>
  <p class="sub">Enter your details, then record in your browser or upload an audio file.</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  <form id="submitForm" class="card" method="POST" action="/submit" enctype="multipart/form-data">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>

    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" placeholder="9000000123" required>

    <label>Record audio</label>
    <div class="rec-controls">
      <button type="button" id="recordBtn">🎙 Start recording</button>
      <span id="timer"></span>
    </div>
    <audio id="preview" controls style="display:none;"></audio>
    <div id="status"></div>

    <div class="or-divider">— or —</div>

    <label for="fileInput">Upload an audio file instead</label>
    <input type="file" id="fileInput" accept="audio/*">

    <button type="submit" class="submit-btn" id="submitBtn" disabled>Submit</button>
  </form>

  <p style="margin-top:24px;"><a class="nav-link" href="/submissions">→ View all submissions</a></p>

<script>
let mediaRecorder, chunks = [], recordedBlob = null, timerInterval, seconds = 0;

const recordBtn = document.getElementById('recordBtn');
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const timer = document.getElementById('timer');
const fileInput = document.getElementById('fileInput');
const submitBtn = document.getElementById('submitBtn');
const form = document.getElementById('submitForm');

function updateSubmitState() {
  submitBtn.disabled = !(recordedBlob || (fileInput.files && fileInput.files.length));
}

recordBtn.addEventListener('click', async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      preview.src = URL.createObjectURL(recordedBlob);
      preview.style.display = 'block';
      fileInput.value = '';  // recording takes precedence over any prior file selection
      status.textContent = 'Recording captured -- preview above, ready to submit.';
      recordBtn.textContent = '🎙 Re-record';
      recordBtn.classList.remove('recording');
      clearInterval(timerInterval);
      stream.getTracks().forEach(t => t.stop());
      updateSubmitState();
    };
    mediaRecorder.start();
    recordBtn.textContent = '⏹ Stop recording';
    recordBtn.classList.add('recording');
    status.textContent = 'Recording...';
    seconds = 0;
    timer.textContent = '0:00';
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60), s = seconds % 60;
      timer.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  } catch (err) {
    status.textContent = 'Microphone access denied or unavailable: ' + err.message;
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) {
    recordedBlob = null;
    preview.style.display = 'none';
    status.textContent = `File selected: ${fileInput.files[0].name}`;
  }
  updateSubmitState();
});

form.addEventListener('submit', (e) => {
  if (recordedBlob) {
    e.preventDefault();
    const formData = new FormData(form);
    formData.delete('audio');
    const ext = (mediaRecorder.mimeType || 'audio/webm').includes('ogg') ? 'ogg' : 'webm';
    formData.append('audio', recordedBlob, `recording.${ext}`);
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    fetch('/submit', { method: 'POST', body: formData })
      .then(res => { window.location.href = res.url; })
      .catch(() => { status.textContent = 'Submit failed, please try again.'; submitBtn.disabled = false; });
  }
  // if no recordedBlob, the file input branch just does a normal form POST
});
</script>
</body>
</html>
